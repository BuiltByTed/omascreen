name: Arch packages
on:
  workflow_dispatch:
  push:
    paths:
      - 'packaging/omarchy/**'
      - '.github/workflows/arch-package.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Check out Omarchy's package builder
        uses: actions/checkout@v7
        with:
          repository: omacom/omarchy-pkgs
          ref: 914afbff9505fca70c276487c9d5366c400402ec
          path: omarchy-builder
      - name: Add recipes
        run: cp -a packaging/omarchy/pkgbuilds/. omarchy-builder/pkgbuilds/
      - name: Build in isolated Omarchy Arch containers
        working-directory: omarchy-builder
        run: bin/build --package python-rendercanvas python-glfw python-wgpu omascreen
      - name: Install and smoke-test the packages in a fresh container
        run: |
          docker run --rm \
            -v "$PWD/omarchy-builder/build-output/edge/x86_64:/packages:ro" \
            -v "$PWD/packaging/omarchy:/checks:ro" \
            omarchy-pkg-builder:latest-x86_64-edge \
            bash -euc 'sudo pacman -U --noconfirm /packages/*.pkg.tar.zst; QT_QPA_PLATFORM=offscreen python /checks/smoke-installed.py'
      - uses: actions/upload-artifact@v7
        with:
          name: omascreen-arch-x86_64
          path: omarchy-builder/build-output/edge/x86_64/*.pkg.tar.zst
          if-no-files-found: error
